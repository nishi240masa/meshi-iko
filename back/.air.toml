# air（ホットリロード）の設定．開発コンテナ内でのみ使う．
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "yaml", "yml"]
  exclude_dir = ["tmp", "data", "vendor"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true

[log]
  time = true

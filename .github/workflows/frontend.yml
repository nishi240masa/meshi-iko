name: frontend

on:
  push:
    branches: [main]
    paths:
      - "front/**"
      - "back/api/openapi.yaml"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "front/**"
      - "back/api/openapi.yaml"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react:
    name: React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API types
        run: pnpm run generate:api

      - name: Check generated API types are up to date
        run: |
          pnpm run generate:api
          git diff --exit-code -- src/generated/api.ts \
            || (echo "::error::openapi.yaml と src/generated/api.ts がずれています． pnpm run generate:api を実行してコミットしてください" && exit 1)

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

  rust:
    name: Rust
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front/src-tauri

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --locked

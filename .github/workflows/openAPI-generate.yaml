name: openAPI-generate

  # PR の head のリポジトリが base と同じときのみに実行する．
on:
  pull_request:
    paths:
      - "back/api/openapi.yaml"
      - ".github/workflows/openAPI-generate.yaml"

concurrency:
  group: openAPI-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openAPI-generate:
    if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest

    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # goのセットアップはbackend.ymlと同じにする．
      - uses: actions/setup-go@v7
        with:
          # go.mod のバージョンを唯一の正とする．
          go-version-file: back/go.mod
          cache-dependency-path: back/go.sum

      # pnpmのセットアップはfrontend.ymlと同じにする．
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          working-directory: front

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: front
    
      # openapi.yaml を変えた場合にCIでfrontとbackのコードを生成し，差分が出たら，コミットをbotが作るようにする．
      - name: generate backend code
        run: go tool oapi-codegen --config api/oapi-codegen.yaml api/openapi.yaml
        working-directory: back

      - name: generate frontend code
        run: pnpm run generate:api
        working-directory: front 

      - name: check code diff
        run: |
          if ! git diff --quiet -- back/internal/generated/openapi/api.gen.go front/src/generated/api.ts; then
            echo "コードの差分があります．コミットを作ります．"
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add ./back/internal/generated/openapi/api.gen.go ./front/src/generated/api.ts
            git commit -m "Update generated backend and frontend code from openapi.yaml"
            git push
          else
            echo "No code diff found."
          fi

        
